apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: leilao-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask
        image: leilao-flask:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: REDIS_HOST
          value: redis-service
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
  namespace: leilao-ns
spec:
  selector:
    app: flask-app
  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30080
  type: NodePort
